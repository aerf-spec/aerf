[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerf-adversary"
version = "0.2.0.dev1"
description = "Pen-testing library for AERF v0.2 verifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AERF working group" }]
dependencies = [
  "cryptography>=41",
]

[project.scripts]
aerf-adversary = "aerf_adversary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
